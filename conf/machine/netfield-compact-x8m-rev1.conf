#@TYPE: Machine
#@NAME: NETFIELD COMPACT X8M Rev1
#@DESCRIPTION:
#@PARTNUMBERS:
#@MAINTAINER: Hilscher Gesellschaft fuer Systemautomation mbH
#@TEMPLATECONF: meta-hilscher-netfield-imx8/conf/samples

#-------------------------------------------------------------------------------
include conf/machine/include/imx8.inc
SOC_FAMILY .= ":netfield-compact-x8m-revx"

#-------------------------------------------------------------------------------
PRECONFIGURED_SYSTEM_CONNECTIONS ?= "eth0 eth1"

MACHINE_FEATURES += "pci wifi 3g hab"

# No cifx connected via SPI
CIFX_SPI_CONFIGS = ""

MACHINE_ESSENTIAL_EXTRA_RDEPENDS_append += "kernel-module-netanalyzer libnetana netanalyzer-firmware netanalyzer-bsl"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS_append += "uionetx"
# For overlays
MACHINE_ESSENTIAL_EXTRA_RDEPENDS_append += "device-tree"
# To allow updating special eMMC boot partition
MACHINE_ESSENTIAL_EXTRA_RDEPENDS_append += "mmc-utils"
# To be able to use Intel WiFi / BT card
MACHINE_ESSENTIAL_EXTRA_RDEPENDS_append += "linux-firmware-iwlwifi-misc linux-firmware-ibt"
KERNEL_FEATURES_append_pn-linux-imx += " features/iwlwifi/iwlwifi.scc"
KERNEL_FEATURES_append_pn-linux-fslc-imx += " features/iwlwifi/iwlwifi.scc"

# Allow recovery via SWU and USB stick
NETFIELD_IMAGES = "recovery.zip recovery.swu"

SWU_FILES += "${IMX_BOOT_FILE};boot1.bin"
SWU_FILE_ATTRIBUTES += "boot1.bin;path=\"/dev/mmcblk1\";offset=\"${IMX_BOOT_SEEK}K\";name=\"boot.bin\";version;install-if-different=true"

OEM_BRANDING_IMAGES = "hilscher-netfield-image-oem-netfield"
