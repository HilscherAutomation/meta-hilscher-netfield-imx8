# We have a conf and classes directory, add to BBPATH
BBPATH := "${BBPATH}:${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES := "${BBFILES} ${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hilscher-netfield-imx8"
BBFILE_PATTERN_hilscher-netfield-imx8 := "^${LAYERDIR}/"
BBFILE_PRIORITY_hilscher-netfield-imx8 = "100"

LAYERSERIES_COMPAT_hilscher-netfield-imx8 = "kirkstone"
LAYERDEPENDS_hilscher-netfield-imx8 = " \
	core yocto hilscher-netfield hilscher-netfield-oem compulab-bsp-imx8mm freescale-layer gplv2 \
	security tpm-layer openembedded-layer multimedia-layer networking-layer perl-layer meta-python \
	webserver swupdate \
"

BBMASK += " \
    meta-bsp-imx8mm/recipes-release/release/yocto-linux.bbappend \
    meta-bsp-imx8mm/recipes-nxp-demo-experience/nxp-demo-experience/nxp-demo-experience_%.bbappend \
"
